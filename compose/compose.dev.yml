
name: notification-platform-dev

services:
  web:
    image: notification-platform-web:dev
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: development
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    image: notification-platform-api:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://noti_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/noti_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: noti_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: noti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U noti_user -d noti_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  frontend_node_modules:
