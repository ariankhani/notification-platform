name: notification-platform-prod

services:
  api:
    image: notification-platform-api:production
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    env_file:
      - path: ../.env.production
        required: false
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ../docker/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
