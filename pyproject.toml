[project]
name = "notification-platform"
version = "0.1.0"
description = "A role-based notification platform built with FastAPI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.138.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.49.0",
    "pydantic-settings>=2.10.0",
    "PyJWT>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.20",
    "passlib>=1.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
]
